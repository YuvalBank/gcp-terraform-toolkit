name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]

    steps:
      - uses: actions/checkout@v4

      - name: Install Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false

      - name: Install Pester
        shell: pwsh
        run: |
          Install-Module -Name Pester -MinimumVersion 5.5.0 -MaximumVersion 5.99.99 -Force -SkipPublisherCheck -Scope CurrentUser
          Import-Module Pester

      - name: Install PSScriptAnalyzer
        shell: pwsh
        run: |
          Install-Module -Name PSScriptAnalyzer -Force -Scope CurrentUser
          Import-Module PSScriptAnalyzer

      - name: Lint with PSScriptAnalyzer
        shell: pwsh
        run: |
          $settings = Import-PowerShellDataFile -Path ./PSScriptAnalyzerSettings.psd1
          $results = Invoke-ScriptAnalyzer -Path . -Recurse -Settings $settings
          if ($results) {
            $results | Format-Table -AutoSize
            exit 1
          }
          Write-Host "✓ Linting passed" -ForegroundColor Green

      - name: Run Pester tests
        shell: pwsh
        run: |
          $config = New-PesterConfiguration
          $config.Run.Path = './Tests'
          $config.Run.Exit = $true
          $config.Output.Verbosity = 'Detailed'
          Invoke-Pester -Configuration $config

      - name: Verify module loads
        shell: pwsh
        run: |
          Import-Module ./GcpTerraformToolkit.psd1 -Force -Verbose
          $functions = Get-Command -Module GcpTerraformToolkit -Type Function
          Write-Host "✓ Module loaded with $($functions.Count) functions" -ForegroundColor Green
          $functions | Format-Table -AutoSize
