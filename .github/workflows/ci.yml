name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Lint & Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false

      - name: Ensure PSGallery is registered and trusted
        shell: pwsh
        run: |
          # Works around an intermittent GitHub-hosted runner issue where PSGallery
          # is occasionally missing on freshly provisioned windows-latest runners.
          # See: https://github.com/actions/runner-images/issues/13758
          if (-not (Get-PSRepository -Name PSGallery -ErrorAction SilentlyContinue)) {
            Register-PSRepository -Default
          }
          Set-PSRepository -Name PSGallery -InstallationPolicy Trusted

      - name: Install and configure Pester
        shell: pwsh
        run: |
          Install-Module -Name Pester -MinimumVersion 5.5.0 -MaximumVersion 5.99.99 -Force -SkipPublisherCheck -Scope CurrentUser
          Import-Module Pester -Force -PassThru | Out-Null
          Write-Host "Pester module loaded: $(Get-Module -Name Pester | Select-Object -ExpandProperty Version)" -ForegroundColor Green

      - name: Install and configure PSScriptAnalyzer
        shell: pwsh
        run: |
          Install-Module -Name PSScriptAnalyzer -Force -SkipPublisherCheck -Scope CurrentUser
          Import-Module PSScriptAnalyzer -Force -PassThru | Out-Null
          Write-Host "PSScriptAnalyzer module loaded: $(Get-Module -Name PSScriptAnalyzer | Select-Object -ExpandProperty Version)" -ForegroundColor Green

      - name: Lint with PSScriptAnalyzer
        shell: pwsh
        run: |
          $results = Invoke-ScriptAnalyzer -Path . -Recurse -Settings ./PSScriptAnalyzerSettings.psd1
          $results | Format-Table -AutoSize

          $errors = $results | Where-Object { $_.Severity -eq 'Error' }
          if ($errors) {
            Write-Host "::error::PSScriptAnalyzer found $($errors.Count) error(s)."
            exit 1
          }
          Write-Host "Linting passed" -ForegroundColor Green

      - name: Run Pester tests
        shell: pwsh
        run: |
          # Import modules in the same session as tests
          Import-Module Pester -Force
          Import-Module PSScriptAnalyzer -Force
          
          $config = New-PesterConfiguration
          $config.Run.Path = './Tests'
          $config.Run.Exit = $true
          $config.Output.Verbosity = 'Detailed'
          $config.CodeCoverage.Enabled = $true
          $config.CodeCoverage.Path = @('./Public/*.ps1', './Private/*.ps1')
          $config.CodeCoverage.CoveragePercentTarget = 40
          
          Invoke-Pester -Configuration $config

      - name: Verify module loads
        shell: pwsh
        run: |
          Import-Module ./GcpTerraformToolkit.psd1 -Force -Verbose
          $functions = Get-Command -Module GcpTerraformToolkit -Type Function
          Write-Host "Module loaded with $($functions.Count) functions" -ForegroundColor Green
          $functions | Format-Table -AutoSize
